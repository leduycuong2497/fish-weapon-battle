<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thư viện nhân vật — Fish Weapon Battle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #0b1426; color: #eaf6ff; font-family: 'Baloo 2', system-ui, sans-serif; }
      header { padding: 16px; text-align: center; }
      h1 { margin: 0; color: #ffd600; font-size: clamp(24px, 4vw, 40px); }
      #status { color: #9cc3e6; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 16px; }
      figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
      figure img { width: 100%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
      figure a { text-align: center; color: #062244; background: #ffc107; border-radius: 10px; padding: 8px; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>THƯ VIỆN NHÂN VẬT</h1>
      <div id="status">Đang dựng nhân vật 3D…</div>
    </header>
    <main id="grid"></main>
    <script type="module" src="/src/showcase.js"></script>
  </body>
</html>
